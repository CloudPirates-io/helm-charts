# Functional verification for ci/bucket-policy.yaml.
# Applied by test-charts.sh into the scenario's namespace after the release is
# Ready and stable, then waited on for completion. Proves the bucket-init Job
# actually created both buckets and that "mc anonymous set public" on
# verify-public-bucket really allows unauthenticated downloads, while
# verify-private-bucket (no policy) still requires credentials.
apiVersion: batch/v1
kind: Job
metadata:
  name: verify
  labels:
    test-charts.io/verify: "true"
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        test-charts.io/verify: "true"
    spec:
      restartPolicy: Never
      containers:
        - name: verify
          # docker.io/minio/mc ships as a from-scratch image (no /bin/sh), so it can't run
          # a multi-step shell script. aws-cli's image is amazonlinux-based (has a shell)
          # and talks to any S3-compatible endpoint via --endpoint-url, which MinIO is.
          image: docker.io/amazon/aws-cli:2.17.62
          env:
            - name: AWS_ACCESS_KEY_ID
              value: "admin"
            - name: AWS_SECRET_ACCESS_KEY
              value: "verify-minio-password"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
          command:
            - /bin/sh
            - -c
            - |
              set -e
              ENDPOINT="http://test-minio-bucket-policy:9000"
              PRIVATE_BUCKET="verify-private-bucket"
              PUBLIC_BUCKET="verify-public-bucket"

              echo "-> Confirming both default buckets were created by the bucket-init Job"
              aws --endpoint-url "${ENDPOINT}" s3 ls | grep -q "${PRIVATE_BUCKET}"
              aws --endpoint-url "${ENDPOINT}" s3 ls | grep -q "${PUBLIC_BUCKET}"

              echo "-> Uploading an object into the public bucket (authenticated)"
              echo "hello from test-charts verification" > /tmp/upload.txt
              aws --endpoint-url "${ENDPOINT}" s3 cp /tmp/upload.txt "s3://${PUBLIC_BUCKET}/upload.txt"

              echo "-> Uploading an object into the private bucket (authenticated)"
              aws --endpoint-url "${ENDPOINT}" s3 cp /tmp/upload.txt "s3://${PRIVATE_BUCKET}/upload.txt"

              echo "-> Downloading the public object without credentials should succeed"
              if ! aws --no-sign-request --endpoint-url "${ENDPOINT}" s3 cp "s3://${PUBLIC_BUCKET}/upload.txt" /tmp/download-public.txt; then
                echo "ERROR: anonymous download from the public bucket failed"
                exit 1
              fi
              upload_sum=$(md5sum /tmp/upload.txt | awk '{print $1}')
              download_sum=$(md5sum /tmp/download-public.txt | awk '{print $1}')
              if [ "${upload_sum}" != "${download_sum}" ]; then
                echo "ERROR: checksum mismatch on public bucket download (uploaded=${upload_sum}, downloaded=${download_sum})"
                exit 1
              fi

              echo "-> Downloading the private object without credentials should be rejected"
              if aws --no-sign-request --endpoint-url "${ENDPOINT}" s3 cp "s3://${PRIVATE_BUCKET}/upload.txt" /tmp/download-private.txt 2>&1; then
                echo "ERROR: anonymous download from the private bucket succeeded, expected access denied"
                exit 1
              fi

              echo "OK: MinIO bucket policy verification passed"
