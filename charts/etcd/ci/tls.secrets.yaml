# Companion manifest for ci/tls.yaml (see test-charts.sh convention: applied
# into the scenario namespace before install). Contains CA-signed test
# certificates for etcd client-to-server mTLS. These are throwaway CI-only
# certs (not used anywhere else) generated for the "test-etcd-tls" release
# name/namespace, so they are safe to commit in plaintext.
apiVersion: v1
kind: Secret
metadata:
  name: test-etcd-tls-server-certs
type: Opaque
data:
  ca.crt: 
  tls.crt: 
  tls.key: 
---
apiVersion: v1
kind: Secret
metadata:
  name: test-etcd-tls-client-certs
type: Opaque
data:
  ca.crt: 
  tls.crt: 
  tls.key: 
