# Companion manifests for ci/test-acl-replication.yaml.
# Applied by test-charts.sh before the chart is installed for this scenario.
apiVersion: v1
kind: Secret
metadata:
  name: redis-acl-replication
type: Opaque
stringData:
  users.acl: |
    user default off
    user redisadmin on >DefaultPass123! ~* &* +@all
    user sentinelapp on >SentinelAppPass456! ~* &* +@all
---
apiVersion: v1
kind: Secret
metadata:
  name: sentinel-acl-replication
type: Opaque
stringData:
  sentinel-users.acl: |
    user sentineladmin on >SentinelAdminPass789! ~* &* +@all
