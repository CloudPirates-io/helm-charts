suite: test redis Sentinel container asks sentinel.discoveryHosts for the master on startup
templates:
  - statefulset.yaml
set:
  architecture: replication
  replicaCount: 1
  sentinel.enabled: true
tests:
  - it: should not render the extra discovery loop in the Sentinel container when sentinel.discoveryHosts is empty
    asserts:
      - isKind:
          of: StatefulSet
      - notMatchRegex:
          path: spec.template.spec.containers[1].command[2]
          pattern: 'SENTINEL_ADDR'

  - it: should ask every listed Sentinel, keeping an explicit port and defaulting to sentinel.port
    set:
      sentinel.discoveryHosts:
        - sentinel-b.example.net:26380
        - sentinel-c.example.net
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[1].command[2]
          pattern: 'for SENTINEL_ADDR in "sentinel-b\.example\.net:26380" "sentinel-c\.example\.net" ; do'
      - matchRegex:
          path: spec.template.spec.containers[1].command[2]
          pattern: '\*\) SENTINEL_HOST="\$SENTINEL_ADDR"; SENTINEL_PORT=26379 ;;'
      - matchRegex:
          path: spec.template.spec.containers[1].command[2]
          pattern: 'EXISTING_MASTER=\$\(REDISCLI_AUTH="\$\{REDIS_PASSWORD\}" timeout 3 redis-cli -h "\$\{SENTINEL_HOST\}" -p "\$\{SENTINEL_PORT\}" sentinel get-master-addr-by-name mymaster'

  - it: should ask the extra Sentinels after the local ones and before the role check and the pod-0 fallback
    set:
      sentinel.discoveryHosts:
        - sentinel-b.example.net
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[1].command[2]
          pattern: '(?s)Checking existing Sentinels for current master.*if \[ "\$SENTINEL_FOUND_MASTER" = false \]; then\s+for SENTINEL_ADDR.*checking Redis instances directly.*using pod-0 for initial bootstrap'

  - it: should use the Sentinel ACL user for the extra Sentinels when sentinel.acl is enabled
    set:
      sentinel.acl.enabled: true
      sentinel.acl.existingSecret: my-sentinel-acl
      sentinel.acl.defaultUsername: sentinel-admin
      sentinel.discoveryHosts:
        - sentinel-b.example.net
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[1].command[2]
          pattern: 'EXISTING_MASTER=\$\(REDISCLI_AUTH="\$\{SENTINEL_ACL_PASSWORD\}" timeout 3 redis-cli --user sentinel-admin -h "\$\{SENTINEL_HOST\}" -p "\$\{SENTINEL_PORT\}"'
