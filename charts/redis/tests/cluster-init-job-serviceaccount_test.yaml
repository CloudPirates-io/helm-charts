suite: test redis cluster-init job service account
# Asserts run against both templates, so the Job must always match the StatefulSet
templates:
  - job.yaml
  - statefulset.yaml
set:
  architecture: cluster
  replicaCount: 6
  clusterReplicaCount: 1
  fullnameOverride: my-redis
tests:
  - it: should use the default service account and not automount its token by default
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: default
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: should use the chart service account when serviceAccount.create is true
    set:
      serviceAccount:
        create: true
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: my-redis

  - it: should use a custom service account name when set
    set:
      serviceAccount:
        create: true
        name: custom-sa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: custom-sa

  - it: should use an existing service account when create is false and name is set
    set:
      serviceAccount:
        create: false
        name: existing-sa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: existing-sa

  - it: should honor automountServiceAccountToken
    set:
      serviceAccount:
        automountServiceAccountToken: true
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true
