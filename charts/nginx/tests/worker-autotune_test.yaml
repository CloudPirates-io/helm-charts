suite: test writable config
templates:
  - deployment.yaml
  - configmap.yaml
set:
  image:
    tag: 1.6.31@sha256:testdigest123
tests:
  - it: should not render writable config resources by default
    template: deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: writable-nginx-config
          any: true
      - notExists:
          path: spec.template.spec.initContainers

  - it: should render init container and writable mount when enabled
    template: deployment.yaml
    set:
      writableConfig:
        enabled: true
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: copy-nginx-config
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: writable-nginx-config
            mountPath: /etc/nginx
      - contains:
          path: spec.template.spec.volumes
          content:
            name: writable-nginx-config
            emptyDir: {}

  - it: should copy ConfigMaps into the writable directory instead of mounting them
    template: deployment.yaml
    set:
      writableConfig:
        enabled: true
      config: |
        events {}
      serverConfig: |
        server {}
      streamServerConfig: |
        server {}
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: cp /nginx-config-source/main/nginx.conf
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: cp /nginx-config-source/server/
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: cp /nginx-config-source/stream/
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: nginx-config
          any: true
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: nginx-server-config
          any: true
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: stream-server-config
          any: true
