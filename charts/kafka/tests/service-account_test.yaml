suite: test kafka service account
tests:
  - it: should not create a service account by default
    template: serviceaccount.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should use the default service account without a token by default
    template: statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: default
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: should create a service account named after the release
    template: serviceaccount.yaml
    set:
      serviceAccount:
        create: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kafka
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: kafka
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: should run the broker under the created service account
    template: statefulset.yaml
    set:
      serviceAccount:
        create: true
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-kafka

  - it: should respect serviceAccount.name and annotations
    template: serviceaccount.yaml
    set:
      serviceAccount:
        create: true
        name: kafka-sa
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/kafka
    asserts:
      - equal:
          path: metadata.name
          value: kafka-sa
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/kafka

  - it: should use an existing service account when create is false and a name is set
    template: statefulset.yaml
    set:
      serviceAccount:
        name: existing-sa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: existing-sa

  - it: should automount the token when requested
    template: statefulset.yaml
    set:
      serviceAccount:
        create: true
        automountServiceAccountToken: true
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true

  - it: should use the same service account for the metrics exporter
    template: metrics-deployment.yaml
    set:
      metrics:
        enabled: true
      serviceAccount:
        create: true
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-kafka
