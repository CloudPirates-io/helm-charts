{{- if not .Values.config.existingConfigmap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "timescaledb.fullname" . }}
  namespace: {{ include "cloudpirates.namespace" . }}
  labels:
    {{- include "timescaledb.labels" . | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- include "timescaledb.annotations" . | nindent 4 }}
  {{- end }}
data:
  postgresql.conf: |
    # PostgreSQL configuration file

    # Connection Settings
    #
    # listen_addresses defaults to 'localhost' in stock Postgres -- the standard
    # postgres Docker entrypoint normally overrides this to '*' in the generated
    # config specifically so the container is reachable from other pods. Since
    # config_file now points here instead of that generated file, this must be
    # set explicitly, or every other pod loses TCP access to this one.
    listen_addresses = '*'
    {{- if .Values.config.postgresqlMaxConnections }}
    max_connections = {{ .Values.config.postgresqlMaxConnections }}
    {{- else }}
    max_connections = 100
    {{- end }}
    
    # Memory Settings
    {{- if .Values.config.postgresqlSharedBuffers }}
    shared_buffers = {{ .Values.config.postgresqlSharedBuffers }}
    {{- else }}
    shared_buffers = 128MB
    {{- end }}
    
    {{- if .Values.config.postgresqlEffectiveCacheSize }}
    effective_cache_size = {{ .Values.config.postgresqlEffectiveCacheSize }}
    {{- else }}
    effective_cache_size = 4GB
    {{- end }}
    
    {{- if .Values.config.postgresqlWorkMem }}
    work_mem = {{ .Values.config.postgresqlWorkMem }}
    {{- else }}
    work_mem = 4MB
    {{- end }}
    
    {{- if .Values.config.postgresqlMaintenanceWorkMem }}
    maintenance_work_mem = {{ .Values.config.postgresqlMaintenanceWorkMem }}
    {{- else }}
    maintenance_work_mem = 64MB
    {{- end }}
    
    # WAL Settings
    {{- if .Values.config.postgresqlWalBuffers }}
    wal_buffers = {{ .Values.config.postgresqlWalBuffers }}
    {{- else }}
    wal_buffers = 16MB
    {{- end }}
    
    # Checkpoint Settings
    {{- if .Values.config.postgresqlCheckpointCompletionTarget }}
    checkpoint_completion_target = {{ .Values.config.postgresqlCheckpointCompletionTarget }}
    {{- else }}
    checkpoint_completion_target = 0.7
    {{- end }}
    
    # Query Planner Settings
    {{- if .Values.config.postgresqlRandomPageCost }}
    random_page_cost = {{ .Values.config.postgresqlRandomPageCost }}
    {{- else }}
    random_page_cost = 1.1
    {{- end }}
    
    # Logging Settings
    log_destination = 'stderr'
    logging_collector = off
    log_min_messages = warning
    log_min_error_statement = error
    
    {{- if .Values.config.postgresqlLogStatement }}
    log_statement = {{ .Values.config.postgresqlLogStatement | squote }}
    {{- else }}
    log_statement = 'none'
    {{- end }}
    
    {{- if .Values.config.postgresqlLogMinDurationStatement }}
    log_min_duration_statement = {{ .Values.config.postgresqlLogMinDurationStatement }}
    {{- else }}
    log_min_duration_statement = -1
    {{- end }}
    
    # Shared Libraries
    {{- if .Values.config.postgresqlSharedPreloadLibraries }}
    shared_preload_libraries = {{ .Values.config.postgresqlSharedPreloadLibraries | squote }}
    {{- end }}
    
    # Locale and Formatting
    datestyle = 'iso, mdy'
    timezone = 'UTC'
    lc_messages = 'en_US.utf8'
    lc_monetary = 'en_US.utf8'
    lc_numeric = 'en_US.utf8'
    lc_time = 'en_US.utf8'
    default_text_search_config = 'pg_catalog.english'
    
    # Additional Configuration
    {{- range .Values.config.extraConfig }}
    {{ . }}
    {{- end }}

    # Must stay last: postgres applies config sequentially, so anything set here wins
    # over everything above, matching normal ALTER SYSTEM semantics. A relative path
    # here would resolve against the directory containing *this* file
    # (timescaledb.configDir), not PGDATA -- ALTER SYSTEM always writes to
    # PGDATA/postgresql.auto.conf regardless of config_file, so this must be an
    # absolute path to actually find it.
    include_if_exists '{{ include "timescaledb.dataDir" . }}/pgdata/postgresql.auto.conf'
{{- end }}