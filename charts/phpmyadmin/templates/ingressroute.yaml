{{- if .Values.traefik.ingressRoute.enabled -}}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "phpmyadmin.fullname" . }}
  namespace: {{ include "phpmyadmin.namespace" . }}
  labels:
    {{- include "phpmyadmin.labels" . | nindent 4 }}
  {{- with .Values.traefik.ingressRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  entryPoints:
    {{- toYaml .Values.traefik.ingressRoute.entryPoints | nindent 4 }}
  routes:
    - match: Host({{ range .Values.traefik.ingressRoute.hosts }}{{ . | quote }},{{ end }})
      kind: Rule
      {{- if .Values.traefik.ingressRoute.middlewares }}
      middlewares:
        {{- toYaml .Values.traefik.ingressRoute.middlewares | nindent 8 }}
      {{- end }}
      services:
        - name: {{ include "phpmyadmin.fullname" . }}
          port: {{ .Values.service.port }}
  {{- if .Values.traefik.ingressRoute.tls.enabled }}
  tls:
    secretName: {{ .Values.traefik.ingressRoute.tls.secretName }}
    {{- if .Values.traefik.ingressRoute.tls.certResolver }}
    certResolver: {{ .Values.traefik.ingressRoute.tls.certResolver }}
    {{- end }}
  {{- end }}
{{- end }}
