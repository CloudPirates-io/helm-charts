{{- if not .Values.keycloak.existingSecret }}
{{- /* Preserve the generated admin password from the existing Secret so it is not rotated on every upgrade */}}
{{- $existingAdminSecret := (lookup "v1" "Secret" (include "cloudpirates.namespace" .) (include "keycloak.fullname" .)) }}
{{- $adminPassword := "" }}
{{- if and $existingAdminSecret $existingAdminSecret.data (index $existingAdminSecret.data "admin-password") }}
  {{- $adminPassword = index $existingAdminSecret.data "admin-password" }}
{{- else }}
  {{- $adminPassword = (.Values.keycloak.adminPassword | default (randAlphaNum 32) | b64enc) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keycloak.fullname" . }}
  namespace: {{ include "cloudpirates.namespace" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
  {{- with (include "keycloak.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  admin-password: {{ $adminPassword | quote }}
  {{- if .Values.tls.truststorePassword }}
  {{ .Values.tls.truststoreExistingSecretPasswordKey }}: {{ .Values.tls.truststorePassword | b64enc }}
  {{- end }}
{{- end }}
---
{{- if and (not .Values.database.existingSecret) (or (eq .Values.database.type "postgres") (eq .Values.database.type "mysql") (eq .Values.database.type "mariadb") (eq .Values.database.type "mssql")) }}
{{- if and (eq .Values.database.type "postgres") .Values.postgres.enabled }}
{{- /* Use the existing postgres password when postgres is enabled */}}
{{- $existingPostgresSecret := (lookup "v1" "Secret" (include "cloudpirates.namespace" .) (include "postgres.fullname" .Subcharts.postgres)) }}
{{- $postgresPassword := "" }}
{{- if and $existingPostgresSecret $existingPostgresSecret.data }}
  {{- $postgresPassword = index $existingPostgresSecret.data "postgres-password" }}
{{- else }}
  {{- $postgresPassword = (.Values.postgres.auth.password | default (randAlphaNum 32) | b64enc) }}
{{- end }}
{{- else if and (or (eq .Values.database.type "mysql") (eq .Values.database.type "mariadb")) .Values.mariadb.enabled }}
{{- /* Use the existing mariadb password when mariadb is enabled */}}
{{- $existingMariadbSecret := (lookup "v1" "Secret" (include "cloudpirates.namespace" .) (include "mariadb.fullname" .Subcharts.mariadb)) }}
{{- $mariadbPassword := "" }}
{{- $mariadbPasswordKey := "" }}
{{- if .Values.mariadb.auth.username }}
  {{- $mariadbPasswordKey = .Values.mariadb.auth.secretKeys.userPasswordKey }}
  {{- if and $existingMariadbSecret $existingMariadbSecret.data }}
    {{- $mariadbPassword = index $existingMariadbSecret.data $mariadbPasswordKey }}
  {{- else }}
    {{- $mariadbPassword = (.Values.mariadb.auth.password | default (randAlphaNum 32) | b64enc) }}
  {{- end }}
{{- else }}
  {{- $mariadbPasswordKey = .Values.mariadb.auth.secretKeys.rootPasswordKey }}
  {{- if and $existingMariadbSecret $existingMariadbSecret.data }}
    {{- $mariadbPassword = index $existingMariadbSecret.data $mariadbPasswordKey }}
  {{- else }}
    {{- $mariadbPassword = (.Values.mariadb.auth.rootPassword | default (randAlphaNum 32) | b64enc) }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-db" (include "keycloak.fullname" .) }}
  namespace: {{ include "cloudpirates.namespace" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
  {{- with (include "keycloak.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  db-username: {{ (default "root" .Values.mariadb.auth.username) | b64enc | quote }}
  db-password: {{ $mariadbPassword | quote }}
{{- else }}
{{- /* Fallback for external databases */}}
{{- /* Preserve the generated password from the existing Secret so it is not rotated on every upgrade */}}
{{- $existingDatabaseSecret := (lookup "v1" "Secret" (include "cloudpirates.namespace" .) (printf "%s-db" (include "keycloak.fullname" .))) }}
{{- $databasePassword := "" }}
{{- if and $existingDatabaseSecret $existingDatabaseSecret.data (index $existingDatabaseSecret.data "db-password") }}
  {{- $databasePassword = index $existingDatabaseSecret.data "db-password" }}
{{- else }}
  {{- $databasePassword = (.Values.database.password | default (randAlphaNum 32) | b64enc) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-db" (include "keycloak.fullname" .) }}
  namespace: {{ include "cloudpirates.namespace" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
  {{- with (include "keycloak.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  db-username: {{ .Values.database.username | b64enc | quote }}
  db-password: {{ $databasePassword | quote }}
{{- end }}
{{- end }}
