suite: test keycloak credentials secret
templates:
  - secret.yaml
set:
  postgres:
    enabled: false
tests:
  - it: should render the admin password from the configured value
    documentIndex: 0
    set:
      keycloak:
        adminPassword: adminpass
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-keycloak
      - equal:
          path: data.admin-password
          value: YWRtaW5wYXNz

  - it: should generate the admin password when it is not configured
    documentIndex: 0
    asserts:
      - matchRegex:
          path: data.admin-password
          pattern: ^[A-Za-z0-9+/]{43}=$

  - it: should render the external database password from the configured value
    documentIndex: 1
    set:
      database:
        type: mysql
        host: db.example.com
        name: keycloak
        username: kcuser
        password: kcpass
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-keycloak-db
      - equal:
          path: data.db-username
          value: a2N1c2Vy
      - equal:
          path: data.db-password
          value: a2NwYXNz

  - it: should generate the external database password when it is not configured
    documentIndex: 1
    set:
      database:
        type: mysql
        host: db.example.com
        name: keycloak
        username: kcuser
    asserts:
      - matchRegex:
          path: data.db-password
          pattern: ^[A-Za-z0-9+/]{43}=$

  - it: should not create the database credentials Secret when database.type is empty
    set:
      database:
        type: ""
    asserts:
      - hasDocuments:
          count: 1
