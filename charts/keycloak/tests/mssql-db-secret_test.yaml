suite: test keycloak external database credentials secret
templates:
  - secret.yaml
set:
  postgres:
    enabled: false
  database:
    host: db.example.com
    name: keycloak
    username: kcuser
    password: kcpass
tests:
  - it: should create the db credentials Secret for mssql
    documentIndex: 1
    set:
      database:
        type: mssql
        port: "1433"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-keycloak-db
      - equal:
          path: data.db-username
          value: a2N1c2Vy
      - equal:
          path: data.db-password
          value: a2NwYXNz

  - it: should create the db credentials Secret for an external postgres
    documentIndex: 1
    set:
      database:
        type: postgres
        port: "5432"
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-keycloak-db
      - equal:
          path: data.db-username
          value: a2N1c2Vy

  - it: should not create the db credentials Secret when existingSecret is set
    set:
      database:
        type: mssql
        port: "1433"
        existingSecret: my-db-secret
    asserts:
      - hasDocuments:
          count: 1
