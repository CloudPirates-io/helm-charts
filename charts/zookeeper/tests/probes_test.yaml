# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: zookeeper probes
templates:
  - templates/statefulset.yaml

tests:
  - it: should render liveness and readiness probes and no startupProbe by default
    asserts:
      - exists:
          path: spec.template.spec.containers[0].livenessProbe
      - exists:
          path: spec.template.spec.containers[0].readinessProbe
      - notExists:
          path: spec.template.spec.containers[0].startupProbe

  - it: should omit the liveness probe when livenessProbe.enabled is false
    set:
      livenessProbe.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe
      - exists:
          path: spec.template.spec.containers[0].readinessProbe

  - it: should omit the readiness probe when readinessProbe.enabled is false
    set:
      readinessProbe.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe
      - exists:
          path: spec.template.spec.containers[0].livenessProbe

  - it: should render the startupProbe when startupProbe.enabled is true
    set:
      startupProbe.enabled: true
      startupProbe.failureThreshold: 60
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe
          value:
            tcpSocket:
              port: client
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
            successThreshold: 1
