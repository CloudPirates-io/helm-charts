suite: Test setup
templates:
  - setup-job.yaml
  - setup-secret.yaml

tests:
  - it: No setup should be present
    asserts:
      - hasDocuments:
          count: 0

  - it: Secret should be present
    set:
      setup:
        buckets:
          - name: test
    template: setup-secret.yaml
    asserts:
      - documentIndex: 0
        equal:
          path: kind
          value: Secret

      - documentIndex: 0
        equal:
          path: metadata.name
          value: RELEASE-NAME-rustfs-setup

  - it: Secret should not be present if custom defined
    set:
      setup:
        existingSecret: "katze"
    template: setup-secret.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: Setup job should be present
    set:
      setup:
        buckets:
          - name: test
    template: setup-job.yaml
    asserts:
      - documentIndex: 0
        equal:
          path: kind
          value: Job

      - documentIndex: 0
        equal:
          path: metadata.name
          value: RELEASE-NAME-rustfs-setup

  - it: Setup job should be a post-install/post-upgrade hook
    set:
      setup:
        buckets:
          - name: test
    template: setup-job.yaml
    asserts:
      - documentIndex: 0
        equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install,post-upgrade

      - documentIndex: 0
        equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation

  - it: Setup job should use the image pull secrets and the service account
    set:
      global:
        imagePullSecrets:
          - registry-secret
      setup:
        buckets:
          - name: test
    template: setup-job.yaml
    asserts:
      - documentIndex: 0
        contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: registry-secret
      - documentIndex: 0
        equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-rustfs

  - it: Setup job containers should run with the chart security context and resources
    set:
      setup:
        buckets:
          - name: test
        resources:
          limits:
            memory: 64Mi
    template: setup-job.yaml
    asserts:
      - documentIndex: 0
        equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - documentIndex: 0
        equal:
          path: spec.template.spec.initContainers[0].securityContext.allowPrivilegeEscalation
          value: false
      - documentIndex: 0
        equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 64Mi
