{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rustfs.fullname" . }}
  namespace: {{ include "cloudpirates.namespace" . }}
  labels:
    {{- include "rustfs.labels" . | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- include "rustfs.annotations" . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- $existingSecret := (lookup "v1" "Secret" (include "cloudpirates.namespace" .) (include "rustfs.fullname" .)) }}
  {{- $existingSecretKey := "" }}
  {{- if and $existingSecret $existingSecret.data }}
    {{- $existingSecretKey = index $existingSecret.data "secret-key" }}
  {{- end }}
  access-key: {{ .Values.auth.accessKey | b64enc | quote }}
  {{- /* An explicit auth.secretKey always wins; the existing Secret only keeps a generated key stable across upgrades. */}}
  secret-key: {{ ternary (.Values.auth.secretKey | b64enc) ($existingSecretKey | default (randAlphaNum 32 | b64enc)) (not (empty .Values.auth.secretKey)) | quote }}
{{- end }}