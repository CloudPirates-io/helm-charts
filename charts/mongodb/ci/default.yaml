# CI scenario: default standalone MongoDB deployment with a deterministic root password
# Exercises: basic deployment, service exposure, and root authentication
image:
  pullPolicy: IfNotPresent

auth:
  rootUsername: admin
  rootPassword: "RootPass123!"

persistence:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# Workaround for MongoDB 8.x crashing on boot under Linux kernel >=6.19 (TCMalloc/glibc
# incompatibility, MongoDB SERVER-121912). Needed on CI runners/kind nodes with newer kernels.
experimental:
  tcmallocRseqWorkaround:
    enabled: true
