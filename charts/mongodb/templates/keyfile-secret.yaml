{{- if and (or .Values.replicaSet.enabled .Values.shardedCluster.enabled) (or .Values.auth.enabled .Values.replicaSet.key .Values.shardedCluster.keyFile) }}
{{- if not (or .Values.replicaSet.keySecretName .Values.shardedCluster.keySecretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mongodb.keyfileSecretName" . }}
  namespace: {{ include "cloudpirates.namespace" . }}
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
  {{- with (include "mongodb.annotations" .) }}
  annotations:
{{- . | indent 4 }}
  {{- end }}
type: Opaque
data:
  {{- $existingSecret := (lookup "v1" "Secret" (include "cloudpirates.namespace" .) (include "mongodb.keyfileSecretName" .)) }}
  {{- $existingKeyfile := "" }}
  {{- if and $existingSecret $existingSecret.data }}
    {{- $existingKeyfile = index $existingSecret.data "keyfile" | default "" }}
  {{- end }}
  {{- $configuredKey := coalesce .Values.shardedCluster.keyFile .Values.replicaSet.key }}
  {{- if $configuredKey }}
  keyfile: {{ $configuredKey | b64enc | quote }}
  {{- else }}
  keyfile: {{ $existingKeyfile | default (randAlphaNum 64 | b64enc) | quote }}
  {{- end }}
{{- end }}
{{- end }}
