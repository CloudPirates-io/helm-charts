suite: test mongodb replica set topologySpreadConstraints
tests:
  - it: should render a list of topologySpreadConstraints on the arbiter
    template: statefulset-arbiter.yaml
    set:
      replicaSet.enabled: true
      replicaSet.arbiter.enabled: true
      replicaSet.arbiter.topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints
          value:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway

  - it: should render a list of topologySpreadConstraints on the hidden secondaries
    template: statefulset-hidden.yaml
    set:
      replicaSet.enabled: true
      replicaSet.hiddenSecondaries.instances: 1
      replicaSet.hiddenSecondaries.topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints
          value:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule

  - it: should not render topologySpreadConstraints on the arbiter by default
    template: statefulset-arbiter.yaml
    set:
      replicaSet.enabled: true
      replicaSet.arbiter.enabled: true
    asserts:
      - notExists:
          path: spec.template.spec.topologySpreadConstraints
