suite: test mongodb keyfile secret
templates:
  - keyfile-secret.yaml
tests:
  - it: should not create the keyfile secret in standalone mode
    asserts:
      - hasDocuments:
          count: 0

  - it: should generate a keyfile when replicaSet is enabled without a key
    set:
      replicaSet:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-mongodb-keyfile
      - matchRegex:
          path: data.keyfile
          pattern: ^[A-Za-z0-9+/]{86}==$

  - it: should generate a keyfile when shardedCluster is enabled without a keyFile
    set:
      shardedCluster:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - matchRegex:
          path: data.keyfile
          pattern: ^[A-Za-z0-9+/]{86}==$

  - it: should use the configured replicaSet key
    set:
      replicaSet:
        enabled: true
        key: some-replicaset-key
    asserts:
      - equal:
          path: data.keyfile
          value: c29tZS1yZXBsaWNhc2V0LWtleQ==

  - it: should prefer shardedCluster.keyFile over replicaSet.key
    set:
      shardedCluster:
        enabled: true
        keyFile: sharded-key
      replicaSet:
        key: some-replicaset-key
    asserts:
      - equal:
          path: data.keyfile
          value: c2hhcmRlZC1rZXk=

  - it: should reuse the keyfile of an existing secret on upgrade
    set:
      replicaSet:
        enabled: true
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: RELEASE-NAME-mongodb-keyfile
            namespace: NAMESPACE
          data:
            keyfile: ZXhpc3Rpbmcta2V5ZmlsZQ==
    asserts:
      - equal:
          path: data.keyfile
          value: ZXhpc3Rpbmcta2V5ZmlsZQ==

  - it: should not create the keyfile secret when replicaSet.keySecretName is set
    set:
      replicaSet:
        enabled: true
        keySecretName: my-keyfile
    asserts:
      - hasDocuments:
          count: 0
